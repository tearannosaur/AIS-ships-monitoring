<!DOCTYPE html>
<html>
<head>
    <title>Сегменты реки</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div style="display: flex; justify-content: center;">

    <a href="/scan" class="mainpage">Сканировать файлы</a>
    <div class="dropdown">
        <button class="dropbtn">База Данных</button>
        <div class="dropdown-content">
            <a href="/segments">Сегменты реки</a>
            <a href="/objects">Объекты реки</a>
            <a href="/mmsi">Найденные объекты</a>
        </div>
    </div>
     <a href="/segments/new" target="_blank" class="mainpage">Создать новый сегмент</a>
     <a href="/segments/edit" target="_blank" class="mainpage">Редактировать сегмент</a>
     <a href="/segments/delete" target="_blank" class="mainpage">Удалить сегмент</a>
</div>

<div>
    <table class="table">
        <tr><th>Км реки</th><th>Город</th><th>Глубина</th><th>Широта</th><th>Долгота</th></tr>
        {{range .}}
        <tr>
            <td>{{.KilometerId}}</td>
            <td>{{.City}}</td>
            <td>{{.Depth}}</td>
            <td>{{.SegmentLatitude}}</td>
            <td>{{.SegmentLongitude}}</td>
        </tr>
        {{end}}

    </table>
</div>
</body>
