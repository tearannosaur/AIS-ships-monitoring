<!DOCTYPE html>
<html>
<head>
    <title>Удалить объект</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
      <div style="display: flex; justify-content: center;">
    
    <a href="/scan" class="mainpage">Сканировать файлы</a>
    <div class="dropdown">
        <button class="dropbtn">База Данных</button>
        <div class="dropdown-content">
            <a href="/segments">Сегменты реки</a>
            <a href="/objects">Объекты реки</a>
            <a href="/mmsi">Найденные объекты</a>

        </div>
    </div>
        <a href="/objects/new" target="_blank" class="mainpage">Создать новый объект</a>
        <a href="/objects/edit" target="_blank" class="mainpage">Редактировать объект</a>
        <a href="/objects/delete" target="_blank" class="mainpage">Удалить объект</a>
</div>
{{if .Error}}
  <div class="errorpage">{{.Error}}</div>
{{end}}
{{if eq .Success "1"}}
  <div class="success">Объект успешно удален</div>
{{end}}
<div class="formobj">
<form action="/objects/delete" method="POST">

    <div class="formtext">Введите id объекта который хотите удалить</div>
        <input type="text" name="objid" placeholder="Введите id объекта" class="forminput">
    <div>
        <input type="submit" value="Удалить">
    </div>

</form>
</div>
</body>
