<!DOCTYPE html>
<html>
<head>
    <title>Список mmsi</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
    <script src="https://ajax.googleapis.com/ajax/libs/jquery/3.6.0/jquery.min.js"></script>
    <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<div style="display: flex; justify-content: center;">
    
    <a href="/scan" class="mainpage">Сканировать файлы</a>
    <div class="dropdown">
        <button class="dropbtn">База Данных</button>
        <div class="dropdown-content">
            <a href="/segments">Сегменты реки</a>
            <a href="/objects">Объекты реки</a>
            <a href="/mmsi">Найденные объекты</a>

        </div>
    </div>
</div>

<div>
    <table class="table">
        <tr><th>MMSI</th>
        
        {{range .}}
        <tr>
            <td><a href="/mmsi/{{.}}">{{.}}</a></td>
        </tr>
        {{end}}
       

    </table>
</div>
</body>
